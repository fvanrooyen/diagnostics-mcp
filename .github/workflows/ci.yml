name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests (SQLite backend; Postgres tests skip without TEST_DATABASE_URL)
        run: pytest tests/ -v

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Helm lint (with required placeholder values)
        run: |
          helm lint charts/diagnostics \
            --set image.repository=example.com/diag \
            --set domain=diag.example.com \
            --set ingress.certificateArn=arn:aws:acm:us-east-1:000000000000:certificate/placeholder \
            --set serviceAccount.roleArn=arn:aws:iam::000000000000:role/placeholder

      - name: Helm template renders
        run: |
          helm template diagnostics charts/diagnostics \
            --set image.repository=example.com/diag \
            --set domain=diag.example.com \
            --set ingress.certificateArn=arn:aws:acm:us-east-1:000000000000:certificate/placeholder \
            --set serviceAccount.roleArn=arn:aws:iam::000000000000:role/placeholder >/dev/null
