# AWS Secrets Manager store (RDS-managed DB password). ESO authenticates via IRSA
# (the external-secrets ServiceAccount is annotated with the eso role by Terraform).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1            # match var.region
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
