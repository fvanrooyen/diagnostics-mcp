# Materializes the OAuth RSA signing key from Vault into a Kubernetes Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth-signing
  namespace: diagnostics
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: oauth-signing          # -> Secret/oauth-signing, key signing_key.pem
    creationPolicy: Owner
  data:
    - secretKey: signing_key.pem
      remoteRef:
        key: oauth/signing        # KV v2 path under secret/
        property: signing_key.pem
