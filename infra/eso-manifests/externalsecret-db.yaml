# Builds the database URL from the AWS-managed RDS password + a literal host.
# Replace <RDS_ENDPOINT> with `terraform output -raw rds_endpoint`, and
# <RDS_SECRET_NAME> with the name (not ARN) of the RDS master secret
# (`aws secretsmanager describe-secret --secret-id <arn> --query Name --output text`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth-db
  namespace: diagnostics
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: oauth-db               # -> Secret/oauth-db, key database_url
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        database_url: "postgresql://{{ .username }}:{{ .password }}@<RDS_ENDPOINT>:5432/oauth"
  data:
    - secretKey: username
      remoteRef:
        key: <RDS_SECRET_NAME>
        property: username
    - secretKey: password
      remoteRef:
        key: <RDS_SECRET_NAME>
        property: password
